name: ci

# Typecheck and test gates for pull requests and for main.
#
# `index.ts` and the sources under `src/` ship as TypeScript and are compiled by
# the host when it loads the plugin, so a type error is a runtime failure for
# users rather than a build error. The TUI entry is different: OpenCode resolves
# `tui.js`, because the host JSX loader skips `node_modules`, so the Solid
# output is compiled here instead of at load time. That artifact is committed,
# and this workflow fails when it no longer matches `tui.tsx`.
#
# The suites under `tests/` run with Bun's test runner against the built entry,
# the one a host without the transform actually loads. Node installs the
# dependency tree so CI shares `package-lock.json`, which is the single source
# of the dependency tree that gets published.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the TUI entry
        run: npm run build

      # The build is deterministic, so any reported entry means `tui.js` was not
      # regenerated after a change to `tui.tsx`, or was never committed.
      - name: Check that tui.js matches tui.tsx
        run: test -z "$(git status --porcelain -- tui.js)"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: npm ci

      # `npm test` rebuilds `tui.js` first, so the suites always exercise the
      # current sources rather than the committed artifact.
      - name: Test
        run: npm test
