name: ci

# Typecheck and test gates for pull requests and for main.
#
# The package ships TypeScript sources (`index.ts`, `tui.tsx`, `src/`) that
# OpenCode compiles when it loads the plugin, so a type error is a runtime
# failure for users rather than a build error. There is no build step to catch
# it, which makes this workflow the only check between a broken type and a
# published release.
#
# The suites under `tests/` run with Bun's test runner. Node still installs the
# dependency tree so both jobs share `package-lock.json`, which is the single
# source of the dependency tree that gets published.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: npm ci

      # `--pass-with-no-tests` keeps main green until the first suite lands.
      # Once `tests/` holds a test file the flag changes nothing.
      - name: Test
        run: bun test --pass-with-no-tests --preload @opentui/solid/preload tests
